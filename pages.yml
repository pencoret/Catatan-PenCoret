media:
  input: static/images
  output: /images

content:
  - name: catatan
    label: Catatan & Berita
    type: collection
    path: content/catatan
    view:
      fields: [title, rubrik, date]
      primary: title
      sort: [date, title]
    fields:
      - name: title
        label: Judul Tulisan
        type: string
        required: true
      - name: rubrik
        label: Rubrik
        type: select
        options:
          values:
            - Informasi
            - Opini
            - Seni & Budaya
            - Teknologi
            - Catatan
        default: Informasi
      - name: date
        label: Tanggal
        type: date
        required: true
      - name: sumber
        label: Sumber / Rujukan (Opsional)
        type: string
      - name: ringkasan
        label: Ringkasan Akhir
        type: text
      - name: body
        label: Isi Tulisan (Gaya Berita / Laporan)
        type: rich-text

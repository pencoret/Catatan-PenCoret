<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ with .Params.seo_title }}{{ . }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Params.description }}{{ . }}{{ else }}Catatan PenCoret — Situs Informasi & Opini{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:title" content="{{ with .Params.seo_title }}{{ . }}{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:description" content="{{ with .Params.description }}{{ . }}{{ else }}Catatan PenCoret — Situs Informasi & Opini{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  {{ with .Params.gambar }}
  <meta property="og:image" content="{{ . | absURL }}">
  {{ end }}

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.7; color: #1f2937; background: #ffffff; margin: 0; padding: 0; }
    header, main, footer { max-width: 740px; margin: 0 auto; padding: 16px 20px; }
    header { border-bottom: 1px solid #e5e7eb; padding-top: 24px; padding-bottom: 16px; }
    header a { text-decoration: none; color: #111827; font-weight: 700; font-size: 1.35rem; }
    header p { margin: 4px 0 0; font-size: 0.9rem; color: #6b7280; }
    h1 { font-size: 1.8rem; line-height: 1.3; margin-bottom: 10px; color: #111827; }
    .meta { font-size: 0.88rem; color: #6b7280; margin-bottom: 18px; }
    .badge { background: #f3f4f6; color: #374151; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
    figure { margin: 0 0 22px; }
    figure img { width: 100%; height: auto; border-radius: 8px; display: block; }
    figcaption { font-size: 0.82rem; color: #6b7280; margin-top: 6px; }
    .ringkasan { background: #f9fafb; border-left: 4px solid #111827; padding: 12px 16px; margin: 22px 0; border-radius: 0 6px 6px 0; }
    .tags { margin-top: 24px; font-size: 0.85rem; color: #4b5563; }
    .card { border-bottom: 1px solid #e5e7eb; padding: 18px 0; }
    .card h2 { margin: 6px 0; font-size: 1.25rem; }
    .card h2 a { text-decoration: none; color: #111827; }
    .card h2 a:hover { text-decoration: underline; }
    footer { border-top: 1px solid #e5e7eb; margin-top: 36px; font-size: 0.85rem; color: #6b7280; text-align: center; }
  </style>
</head>
<body>
  <header>
    <a href="/">Catatan PenCoret</a>
    <p>Situs Informasi &amp; Opini</p>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    &copy; {{ now.Year }} Catatan PenCoret
  </footer>
</body>
  </html>
